<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title>Figma Analytics Export</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="shared/panel-footer.css">
</head>
<body>
  <div id="panelLoader" class="panel-loader" hidden aria-live="polite" aria-label="Updating view">
    <span class="panel-loader__icon" aria-hidden="true"></span>
  </div>

  <div id="viewIdent" class="view-ident" hidden>
    <div id="viewBreadcrumb" class="view-ident__breadcrumb"></div>
    <div id="viewTitle" class="view-ident__title"></div>
    <div id="viewSubtitle" class="view-ident__subtitle view-ident__item-line" hidden>
      <span id="viewVariantOfPrefix" class="view-ident__variant-of" hidden>Variant of</span>
      <span id="viewSubtitleText" hidden></span>
      <span id="viewEntityLabel" class="view-ident__entity-label" hidden></span>
    </div>
    <div id="typeBlock" class="view-ident__subtab-block" hidden>
      <div class="control-label">Type</div>
      <div id="typeSegmented" class="format-segmented view-ident__subtab-segmented" role="radiogroup" aria-label="Analytics type">
        <button type="button" class="format-segment" data-type="components" role="radio" aria-checked="false">Components</button>
        <button type="button" class="format-segment" data-type="styles" role="radio" aria-checked="false">Styles</button>
        <button type="button" class="format-segment" data-type="variables" role="radio" aria-checked="false">Variables</button>
      </div>
    </div>
    <div id="durationBlock" class="view-ident__subtab-block" hidden>
      <div class="control-label">Duration</div>
      <div id="durationSegmented" class="format-segmented view-ident__subtab-segmented view-ident__duration-segmented" role="radiogroup" aria-label="Analytics duration">
        <button type="button" class="format-segment" data-duration="30" role="radio" aria-checked="false">30 days</button>
        <button type="button" class="format-segment" data-duration="60" role="radio" aria-checked="false">60 days</button>
        <button type="button" class="format-segment" data-duration="90" role="radio" aria-checked="false">90 days</button>
        <button type="button" class="format-segment" data-duration="year" role="radio" aria-checked="false">Year</button>
      </div>
    </div>
  </div>

  <div id="variablesSubTabBlock" class="view-ident__subtab-block" hidden>
    <div id="variablesSubTabSegmented" class="format-segmented view-ident__subtab-segmented" role="radiogroup" aria-label="Variables list tab">
      <button type="button" class="format-segment" data-subtab="variables" role="radio" aria-checked="true">
        <span class="format-segment__icon" data-segment-icon="variable" aria-hidden="true"></span>
        <span class="format-segment__label">Variables</span>
      </button>
      <button type="button" class="format-segment" data-subtab="modes" role="radio" aria-checked="false">
        <span class="format-segment__icon" data-segment-icon="variableMode" aria-hidden="true"></span>
        <span class="format-segment__label">Modes</span>
      </button>
    </div>
  </div>

  <div id="detectionCard" class="detection-card detection-waiting" role="status" aria-live="polite" hidden>
    <div id="statusIcon" class="detection-card__icon" aria-hidden="true">○</div>
    <div class="detection-card__body">
      <div id="statusTitle" class="detection-card__title">Looking for Library Analytics</div>
      <div id="statusDetail" class="detection-card__detail">
        Open the analytics modal in Figma. This panel updates automatically.
      </div>
      <button id="switchAnalyticsTabBtn" type="button" class="detection-card__action primary" hidden>
        Switch to Analytics
      </button>
    </div>
  </div>

  <div id="feedback" class="feedback" hidden role="status" aria-live="polite"></div>

  <div id="panelInsights" class="panel-insights" hidden></div>

  <div id="actionBlock" class="action-block" hidden>
    <div id="actionBlockContent" class="action-block__content">
      <div class="control-label">Export as</div>
      <div id="formatSegmented" class="format-segmented" role="radiogroup" aria-label="Export format">
        <button type="button" class="format-segment is-selected" data-format="csv" role="radio" aria-checked="true">CSV</button>
        <button type="button" class="format-segment" data-format="json" role="radio" aria-checked="false">JSON</button>
        <button type="button" class="format-segment" data-format="md" role="radio" aria-checked="false">Markdown</button>
      </div>
      <label id="includeInsightsBlock" class="include-insights" hidden>
        <input id="includeInsightsCheckbox" type="checkbox">
        <span>Include insights</span>
      </label>
      <button id="downloadBtn" class="primary" disabled>
        <span class="download-btn__icon" data-segment-icon="export" aria-hidden="true"></span>
        <span id="downloadBtnLabel" class="download-btn__label">Download unavailable</span>
      </button>
    </div>
    <div id="actionBlockSkeleton" class="action-block__skeleton panel-skeleton" hidden aria-hidden="true">
      <div class="panel-skeleton__line panel-skeleton__line--label"></div>
      <div class="panel-skeleton__line panel-skeleton__line--segmented"></div>
      <div class="panel-skeleton__line panel-skeleton__line--checkbox"></div>
      <div class="panel-skeleton__line panel-skeleton__line--button"></div>
    </div>
  </div>

  <script src="shared/panel-footer.js"></script>
  <script src="shared/panel-insights-expand.js"></script>
  <script src="shared/figma-url.js"></script>
  <script src="shared/view-labels.js"></script>
  <script src="shared/entity-icon-inline.js"></script>
  <script src="shared/entity-icons.js"></script>
  <script src="shared/view-transition.js"></script>
  <script src="shared/insights.js"></script>
  <script src="shared/export-format.js"></script>
  <script src="popup.js"></script>
</body>
</html>
